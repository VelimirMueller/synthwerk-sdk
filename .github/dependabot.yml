# Weekly, grouped, one PR per ecosystem (CI-COST-04).
# No target-branch: updates go to the default branch. That is main today and becomes
# develop when the control repo creates it (fleet-standard#7, GOV-REPO-01).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
