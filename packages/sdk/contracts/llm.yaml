openapi: 3.1.0
info:
  title: Synthwerk LLM gateway
  version: 0.1.0
  summary: Conversations and streamed answers. The M2 chat slice of synthwerk-llm.
  description: |
    The chat contract of synthwerk-llm (M2 spec #32, D-44).
    - A conversation belongs to one user (token `sub`) in one org (token org claim).
    - The org and the owner come from the verified token only. They are never body fields.
    - Send a message, get the answer as Server-Sent Events: `delta`, `usage`, `done`, or `error`.
    - Errors are RFC 9457 `application/problem+json` with a stable `code`.
    - Stream protocol: `docs/features/llm-chat-api.md`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Velimir Mueller
    url: https://github.com/VelimirMueller/synthwerk-contracts
tags:
  - name: conversations
    description: Conversations and their messages.
security:
  - bearer: []
paths:
  /v1/conversations:
    post:
      operationId: llm.createConversation
      summary: Create a conversation
      description: Creates an empty conversation for the caller in the org of the token.
      tags: [conversations]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
            example:
              model: default
      responses:
        "201":
          description: Conversation created.
          headers:
            Location:
              description: Path of the new conversation.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                id: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                model: default
                created_at: "2026-10-23T09:00:00Z"
                messages: []
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
  /v1/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: llm.getConversation
      summary: Get a conversation
      description: |
        The conversation with its messages, oldest first.
        An unknown id and another owner's id both answer 404 with the same body.
      tags: [conversations]
      security:
        - bearer: []
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                id: 6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                model: default
                created_at: "2026-10-23T09:00:00Z"
                messages:
                  - id: 0199f3b0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    role: user
                    content: What does pulse check?
                    status: completed
                    created_at: "2026-10-23T09:00:05Z"
                  - id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10
                    role: assistant
                    content: Pulse reads /readyz of every service.
                    status: completed
                    created_at: "2026-10-23T09:00:05Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: llm.sendMessage
      summary: Send a message and stream the answer
      description: |
        Stores the user message and streams the assistant answer as Server-Sent Events.
        - Refusals before the first byte answer with a status code and `application/problem+json`.
        - After the first byte the status stays 200. A failure is an `error` event, then the stream ends.
        - Order of events: zero or more `delta`, then `usage`, then `done`. Or an `error` event at any point.
        - Cancel: the client closes the connection. The server stops the model call and keeps the partial answer.
        - Headers: `Cache-Control: no-store`, `X-Accel-Buffering: no`. A comment line (`: ping`) every 15 s keeps the connection open.
      tags: [conversations]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              content: What does pulse check?
      responses:
        "200":
          description: |
            The answer as a `text/event-stream`. Each frame is one `StreamEvent`:
            the SSE `event:` field holds `event`, the `data:` field holds `data` as one line of JSON,
            and the `id:` field holds `<message_id>:<sequence>`. On the wire:

            ```text
            id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10:1
            event: delta
            data: {"text":"Pulse reads "}

            id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10:2
            event: delta
            data: {"text":"/readyz of every service."}

            id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10:3
            event: usage
            data: {"input_tokens":412,"output_tokens":9,"model":"default"}

            id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10:4
            event: done
            data: {"message_id":"0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10","finish_reason":"stop"}
            ```
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
              examples:
                delta:
                  summary: A piece of the answer.
                  value:
                    event: delta
                    data:
                      text: "Pulse reads "
                usage:
                  summary: Token use, once before done.
                  value:
                    event: usage
                    data:
                      input_tokens: 412
                      output_tokens: 9
                      model: default
                done:
                  summary: The last event.
                  value:
                    event: done
                    data:
                      message_id: 0199f3b0-1a2c-7c3d-8e4f-5a6b7c8d9e10
                      finish_reason: stop
                error:
                  summary: The model failed after the first byte.
                  value:
                    event: error
                    data:
                      type: https://schemas.synthwerk.dev/problems/model_unavailable
                      title: Model unavailable
                      status: 503
                      code: model_unavailable
                      trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/InputTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Zitadel access token (user or widget token). The org and the owner come from its claims.
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation id.
      schema:
        type: string
        format: uuid
        maxLength: 36
  responses:
    InvalidRequest:
      description: The body or a parameter is not valid. Code `invalid_request`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/invalid_request
            title: Invalid request
            status: 400
            code: invalid_request
            detail: content must not be empty.
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthenticated:
      description: No token, bad signature, expired, wrong issuer or audience. Code `unauthenticated`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            maxLength: 256
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/unauthenticated
            title: Unauthenticated
            status: 401
            code: unauthenticated
    Forbidden:
      description: The token scope or origin does not allow the call. Code `forbidden`. The body is generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
    NotFound:
      description: Unknown id or another owner's id. Same body in both cases. Code `not_found`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/not_found
            title: Not found
            status: 404
            code: not_found
    InputTooLarge:
      description: The message is above the input limit (default 8000 characters). Code `input_too_large`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/input_too_large
            title: Input too large
            status: 413
            code: input_too_large
    TooManyRequests:
      description: |
        - `too_many_streams`: the owner already has the max number of open streams (default 2).
        - `quota_exhausted`: reserved (D-46). M2 has no quotas and never sends it. Clients must handle it already.
      headers:
        Retry-After:
          description: Seconds to wait before a retry.
          schema:
            type: integer
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/too_many_streams
            title: Too many streams
            status: 429
            code: too_many_streams
    ModelUnavailable:
      description: The model cannot answer now (provider down or busy). Code `model_unavailable`.
      headers:
        Retry-After:
          description: Seconds to wait before a retry.
          schema:
            type: integer
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/model_unavailable
            title: Model unavailable
            status: 503
            code: model_unavailable
  schemas:
    ModelAlias:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9_-]*$"
      description: Model alias, for example `default`. Never a provider model name.
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelAlias"
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
          description: The user message. Plain text. Above the server limit the answer is 413.
        model:
          $ref: "#/components/schemas/ModelAlias"
    Conversation:
      type: object
      additionalProperties: false
      required: [id, model, created_at, messages]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        model:
          $ref: "#/components/schemas/ModelAlias"
        created_at:
          type: string
          format: date-time
          maxLength: 40
        messages:
          type: array
          maxItems: 1000
          description: Messages, oldest first.
          items:
            $ref: "#/components/schemas/Message"
    MessageRole:
      type: string
      enum: [user, assistant]
    MessageStatus:
      type: string
      enum: [streaming, completed, failed, canceled]
      description: |
        - `streaming`: the answer is still being written.
        - `completed`: the answer is complete.
        - `failed`: the model call failed. `content` holds the partial answer.
        - `canceled`: the client closed the stream. `content` holds the partial answer.
    Message:
      type: object
      additionalProperties: false
      required: [id, role, content, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
          maxLength: 100000
          description: Plain text. Never HTML.
        status:
          $ref: "#/components/schemas/MessageStatus"
        created_at:
          type: string
          format: date-time
          maxLength: 40
    StreamEvent:
      description: One Server-Sent Event of the answer stream. `event` is the SSE event name.
      oneOf:
        - $ref: "#/components/schemas/DeltaEvent"
        - $ref: "#/components/schemas/UsageEvent"
        - $ref: "#/components/schemas/DoneEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: event
        mapping:
          delta: "#/components/schemas/DeltaEvent"
          usage: "#/components/schemas/UsageEvent"
          done: "#/components/schemas/DoneEvent"
          error: "#/components/schemas/ErrorEvent"
    DeltaEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: delta
        data:
          $ref: "#/components/schemas/Delta"
    Delta:
      type: object
      additionalProperties: false
      required: [text]
      description: The next piece of the answer. Append `text` to the text so far.
      properties:
        text:
          type: string
          maxLength: 8000
    UsageEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: usage
        data:
          $ref: "#/components/schemas/Usage"
    Usage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, model]
      description: Token use of this answer, from the provider. Sent once, before `done`.
      properties:
        input_tokens:
          type: integer
          minimum: 0
          maximum: 10000000
        output_tokens:
          type: integer
          minimum: 0
          maximum: 10000000
        model:
          $ref: "#/components/schemas/ModelAlias"
    DoneEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: done
        data:
          $ref: "#/components/schemas/Done"
    Done:
      type: object
      additionalProperties: false
      required: [message_id, finish_reason]
      description: The last event of a stream that did not fail.
      properties:
        message_id:
          type: string
          format: uuid
          maxLength: 36
          description: Id of the stored assistant message.
        finish_reason:
          type: string
          enum: [stop, length]
          description: |
            - `stop`: the model finished the answer.
            - `length`: the answer hit the output token limit.
    ErrorEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          type: string
          const: error
        data:
          $ref: "#/components/schemas/Problem"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      description: |
        RFC 9457 problem details with the stable Synthwerk `code`.
        Clients branch on `code`, never on `title` or `detail`, and must accept unknown codes.

        | Code | Status | Cause |
        |---|---|---|
        | `invalid_request` | 400 | Body or parameter not valid. |
        | `unauthenticated` | 401 | Token missing or not valid. |
        | `forbidden` | 403 | Scope or origin does not allow the call. |
        | `not_found` | 404 | Unknown id or another owner's id. |
        | `input_too_large` | 413 | Message above the input limit. |
        | `too_many_streams` | 429 | Owner has the max number of open streams. |
        | `quota_exhausted` | 429 | Reserved (D-46). Not sent in M2. |
        | `model_unavailable` | 503 | Provider down or busy. Also as an `error` event mid-stream. |
      properties:
        type:
          type: string
          format: uri
          maxLength: 256
          description: "`https://schemas.synthwerk.dev/problems/<code>`."
        title:
          type: string
          maxLength: 128
          description: Short summary of the problem type. Same for every instance.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status. In an `error` event the HTTP status stays 200; this field holds the status the error maps to.
        code:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine code, for example `model_unavailable`.
        detail:
          type: string
          maxLength: 512
          description: Explanation for this instance. No secrets, no personal data, no provider error text.
        instance:
          type: string
          maxLength: 256
          description: URI of this instance, for example the request path.
        trace_id:
          type: string
          maxLength: 32
          pattern: "^[0-9a-f]{32}$"
          description: W3C trace id of the request, for support.
